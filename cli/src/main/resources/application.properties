app.version=${project.version}

option.args="Additional arguments to pass to the SUL.
option.cache=Use a query cache.
option.delim=The string used to split responses of the SUL into individual output symbols.
option.eqo=The strategy to search for counterexamples. Use repeatedly to build a chain of equivalence oracles. Strategies can be parameterized via the specific '--eqo-*' flags. Possible values are: ${COMPLETION-CANDIDATES}.
option.format=The output format to use for printing the final hypothesis model. Possible values are: ${COMPLETION-CANDIDATES}.
option.learner=The learning algorithm to use. Possible values are: ${COMPLETION-CANDIDATES}.
option.output=The output file to write the final hypothesis model to. If omitted, the final hypothesis model will be printed to standard out.
option.reset=Specifies the reset symbol. If provided, the SUL will be treated as 'stateful' which results in query symbols being applied one-by-one in subsequent invocations. The reset symbol will be used to reset the application state between queries.
option.stats=Enable the collection of statistics which will be printed at the end of the learning process.
option.stdin=Apply query symbols via standard-in as opposed to argument lists to the SUL binary.
option.sul=The path to the SUL used for answering queries.
option.type=The model type to infer. Possible values are: ${COMPLETION-CANDIDATES}.
option.verbose=Increase verbosity. Each repetition increases the log level from (initially) INFO to DEBUG to TRACE.

param.eqo.heading=%nParameters for equivalence oracles:%n
param.eqo.kway-s.k=The 'k' parameter of the kWay state cover oracle.
param.eqo.kway-s.len=The 'randomWalkLen' parameter of the kWay state cover oracle.
param.eqo.kway-s.method=The 'combinationMethod' parameter of the kWay state cover oracle. Possible values are: ${COMPLETION-CANDIDATES}.
param.eqo.kway-s.seed=The seed of the 'random' parameter of the kWay state cover oracle.
param.eqo.kway-t.k=The 'k' parameter of the kWay transition cover oracle.
param.eqo.kway-t.len=The 'randomWalkLen' parameter of the kWay transition cover oracle.
param.eqo.kway-t.method=The 'generationMethod' parameter of the kWay transition cover oracle. Possible values are: ${COMPLETION-CANDIDATES}.
param.eqo.kway-t.metric=The 'optimizationMetric' parameter of the kWay transition cover oracle. Possible values are: ${COMPLETION-CANDIDATES}.
param.eqo.kway-t.num=The 'numGeneratePaths' parameter of the kWay transition cover oracle.
param.eqo.kway-t.path=The 'maxPathLen' parameter of the kWay transition cover oracle.
param.eqo.kway-t.seed=The seed of the 'random' parameter of the kWay transition cover oracle.
param.eqo.kway-t.step=The 'maxNumberOfSteps' parameter of the kWay transition cover oracle.
param.eqo.random-w.bound=The 'bound' parameter of the random W method oracle.
param.eqo.random-w.len=The 'rndLength' parameter of the random W method oracle.
param.eqo.random-w.min=The 'minimalSize' parameter of the random W method oracle.
param.eqo.random-w.seed=The seed of the 'random' parameter of the random W method oracle.
param.eqo.random-wp.bound=The 'bound' parameter of the random Wp method oracle.
param.eqo.random-wp.len=The 'rndLength' parameter of the random Wp method oracle.
param.eqo.random-wp.min=The 'minimalSize' parameter of the random Wp method oracle.
param.eqo.random-wp.seed=The seed of the 'random' parameter of the random Wp method oracle.
param.eqo.random.max=The 'maxLength' parameter of the random word oracle.
param.eqo.random.min=The 'minLength' parameter of the random word oracle.
param.eqo.random.num=The 'maxTests' parameter of the random word oracle.
param.eqo.random.seed=The seed of the 'random' parameter of the random W method oracle.
param.eqo.sample=Provide an explicit trace that should be used for equivalence testing. Use repeatedly to provide multiple traces.
param.eqo.sample.split=The regexp to split and individual symbols of a trace.
param.eqo.w.expected=The 'expectedSize' parameter for the W method oracle.
param.eqo.w.lookahead=The 'lookahead' parameter for the W method oracle.
param.eqo.wp.expected=The 'expectedSize' parameter for the Wp method oracle.
param.eqo.wp.lookahead=The 'lookahead' parameter for the Wp method oracle.

param.symbol.cf.call.description=Define a call symbol. Use repeatedly to define multiple symbols.
param.symbol.cf.heading=%nSymbol definitions for learning context-free systems:%n
param.symbol.cf.int.description=Define an internal symbol. Use repeatedly to define multiple symbols.
param.symbol.cf.ret.description=Define a return symbol. Use repeatedly to define multiple symbols.
param.symbol.reg.description=Define an input symbol. Use repeatedly to define multiple symbols.
param.symbol.reg.heading=%nSymbol definitions for learning regular systems:%n
